<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Link Page</title>
  <style>
    :root{ --bg:#ffffff; --card:#f3f4f6; --accent:#2563eb; --muted:#4b5563; }
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:var(--bg);color:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
    .wrap{max-width:720px;width:100%;}
    header{display:flex;align-items:center;gap:16px;margin-bottom:24px}
    .logo{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#9333ea);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
    h1{font-size:22px;margin:0}
    p.lead{margin:6px 0 0;color:var(--muted);font-size:15px}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
    .card{background:var(--card);padding:18px;border-radius:12px;display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;transition:transform .15s ease,box-shadow .15s ease}
    .card:focus,.card:hover{transform:translateY(-4px);box-shadow:0 6px 16px rgba(0,0,0,.15)}
    .icon{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:10px;background:#fff;}
    .title{font-weight:600}
    .desc{font-size:13px;color:var(--muted);margin-top:4px}

    footer{margin-top:20px;color:var(--muted);font-size:13px;text-align:center}

    @media (max-width:420px){body{padding:18px}.logo{width:52px;height:52px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">Ln</div>
      <div>
        <h1>Simple Link Page</h1>
        <p class="lead">Visit your favorite social sites easily.</p>
      </div>
    </header>

    <main class="grid">
      <a class="card" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="Open YouTube in a new tab">
        <div class="icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.6 31.6 0 0 0 0 12a31.6 31.6 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1c.3-1.9.5-4 .5-5.8s-.2-3.9-.5-5.8z" fill="#FF0000"/>
            <path d="M9.8 15.5V8.5l6.2 3.5-6.2 3.5z" fill="#fff"/>
          </svg>
        </div>
        <div>
          <div class="title">YouTube</div>
          <div class="desc">Watch videos and subscribe to channels</div>
        </div>
      </a>

      <a class="card" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Open Facebook in a new tab">
        <div class="icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 12a10 10 0 1 0-11.5 9.9v-7h-2.2v-2.9h2.2V9.1c
