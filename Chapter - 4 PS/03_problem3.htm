<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelStud.com - Book your travel to anywhere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>TravelStud.com - Book your travel to anywhere</h1>
    <br>
    <form action="">
        <div>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter your name" required>
        </div>
        <br>
        <div>
            <label for="age">Age</label>
            <input id="age" type="number" placeholder="Enter your age" required>
        </div>
        <br>
        <div>
            <label for="ph">Phone Number</label>
            <input id="ph" type="tel" placeholder="Enter your phone number" required>
        </div>
        <br>
        <div>
            <label for="emain">Email</label>
            <input id="emain" type="email" placeholder="Enter your email" required>
        </div>
        <br>
        <div>
            <label for="adress">Adress</label>
            <textarea name="Adress" id="adress" required></textarea>
        </div>
        <br>
        <div>
            <button type="submit">Submit</button>
        </div>
    </form>
</body>
</html>
